name: Build desktop + Android apps

# Builds the Windows installer/portable .exe and an Android debug .apk in the
# cloud, so no local Android Studio or Windows machine is required.
# Run it from the GitHub "Actions" tab (workflow_dispatch) or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/smoke.mjs
      - run: node tools/check-css.mjs

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run electron:build
      - uses: actions/upload-artifact@v4
        with:
          name: PortOps-windows
          path: |
            release/*.exe

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npm run cap:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PortOps-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
